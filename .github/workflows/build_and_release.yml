name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl file jq

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Frontend JS syntax check
        run: |
          for f in app/dist/*.js; do node --check "$f" || exit 1; done

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: w420-deb
          path: packaging/deb/*.deb

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packaging/deb/*.deb
