name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl file

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Юнит-тесты крейтов, которым не нужно локальное окружение машины
      # (app/src-tauri тесты требуют ~/.w420 БД и sidecar-бинарники — их гоняем локально)
      - name: cargo test (w420-core, w420-ai, w420-installer)
        run: cargo test -p w420-core -p w420-ai -p w420-installer

      # Сборка всего workspace (ловит ошибки компиляции app/Tauri)
      - name: cargo build --release (check)
        run: cargo build --release

      # Линт — информативно, без -D warnings (пока идёт доведение кодовой базы)
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets 2>&1 | tail -40
