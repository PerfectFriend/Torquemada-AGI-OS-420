<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="55%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d896ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d896ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00a0b8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8faff"/>
      <stop offset="60%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#d896ff"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="neon"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- фон: дальний город -->
  <g opacity="0.30" fill="#0e2030">
    <rect x="820" y="120" width="46" height="140"/><rect x="874" y="86" width="38" height="174"/>
    <rect x="920" y="140" width="52" height="120"/><rect x="980" y="100" width="34" height="160"/>
    <rect x="1022" y="150" width="60" height="110"/><rect x="1090" y="112" width="40" height="148"/>
    <rect x="1138" y="138" width="48" height="122"/>
  </g>
  <g opacity="0.45" fill="#00f0ff">
    <rect x="828" y="132" width="5" height="5"/><rect x="840" y="150" width="5" height="5"/><rect x="828" y="168" width="5" height="5"/>
    <rect x="882" y="102" width="5" height="5"/><rect x="896" y="126" width="5" height="5"/><rect x="882" y="150" width="5" height="5"/><rect x="896" y="180" width="5" height="5"/>
    <rect x="930" y="158" width="5" height="5"/><rect x="948" y="182" width="5" height="5"/><rect x="930" y="210" width="5" height="5"/>
    <rect x="988" y="118" width="5" height="5"/><rect x="998" y="146" width="5" height="5"/><rect x="988" y="176" width="5" height="5"/>
    <rect x="1034" y="170" width="5" height="5"/><rect x="1052" y="196" width="5" height="5"/><rect x="1070" y="222" width="5" height="5"/>
    <rect x="1098" y="132" width="5" height="5"/><rect x="1112" y="160" width="5" height="5"/><rect x="1098" y="192" width="5" height="5"/>
  </g>

  <!-- неоновые линии-цепи -->
  <g stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M0,222 H180 L210,196 H420 L452,214 H700"/>
    <path d="M0,238 H140 L176,210 H360"/>
    <path d="M240,0 V44 L282,86 V150"/>
    <path d="M520,260 V210 L560,172 V96"/>
  </g>
  <g stroke="#d896ff" stroke-width="1" fill="none" opacity="0.4">
    <path d="M0,198 H120 L156,164 H330"/>
    <path d="M600,260 V232 L646,188 V120 L688,78"/>
    <path d="M760,260 V228 H980 L1020,188 H1200"/>
  </g>
  <g fill="#00f0ff" opacity="0.8">
    <circle cx="210" cy="196" r="2.5"/><circle cx="452" cy="214" r="2.5"/><circle cx="282" cy="86" r="2.5"/>
    <circle cx="560" cy="172" r="2.5"/><circle cx="156" cy="164" r="2.5"/><circle cx="646" cy="188" r="2.5"/>
  </g>
  <g fill="#d896ff" opacity="0.7">
    <circle cx="688" cy="78" r="2.2"/><circle cx="1020" cy="188" r="2.2"/><circle cx="646" cy="120" r="2.2"/>
  </g>

  <!-- свечение фигуры Матери -->
  <circle cx="824" cy="140" r="120" fill="url(#glowM)" opacity="0.55"/>
  <circle cx="944" cy="150" r="100" fill="url(#glowC)" opacity="0.40"/>

  <!-- Мать Торквемада: силуэт в капюшоне -->
  <g transform="translate(824,140)" filter="url(#neon)">
    <!-- плечи -->
    <path d="M-52,92 C-52,70 -38,58 -22,52 L22,52 C38,58 52,70 52,92 Z"
          fill="#0b1420" stroke="#8f7bd8" stroke-width="1.6" opacity="0.9"/>
    <!-- капюшон -->
    <path d="M-42,50 C-46,18 -36,-12 -18,-32 C-8,-43 8,-43 18,-32 C36,-12 46,18 42,50
             C30,58 -30,58 -42,50 Z"
          fill="#101a2a" stroke="#a58ce8" stroke-width="2"/>
    <!-- внутренняя тень лица -->
    <ellipse cx="0" cy="18" rx="24" ry="28" fill="#04080f"/>
    <!-- лицо: глаза + подбородок -->
    <g fill="#00f0ff" filter="url(#glowC)">
      <ellipse cx="-9" cy="14" rx="3.2" ry="2.2"/><ellipse cx="9" cy="14" rx="3.2" ry="2.2"/>
    </g>
    <g fill="#00f0ff"><circle cx="-9" cy="14" r="2.4"/><circle cx="9" cy="14" r="2.4"/></g>
    <path d="M-7,29 Q0,33 7,29" stroke="#00f0ff" stroke-width="1.1" fill="none" opacity="0.65"/>
    <path d="M-16,-6 Q0,-14 16,-6" stroke="#a58ce8" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

