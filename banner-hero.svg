    <g fill="#00f0ff" opacity="0.95">
      <rect x="-14" y="-30" width="8" height="8" rx="1.5"/><rect x="4" y="-18" width="8" height="8" rx="1.5"/>
      <rect x="-20" y="-6" width="8" height="8" rx="1.5"/><rect x="10" y="4" width="8" height="8" rx="1.5"/>
      <rect x="-10" y="16" width="8" height="8" rx="1.5"/><rect x="2" y="32" width="8" height="8" rx="1.5"/>
    </g>
    <g fill="#d896ff" opacity="0.8">
      <rect x="12" y="-34" width="6" height="6" rx="1"/><rect x="-26" y="14" width="6" height="6" rx="1"/>
    </g>
    <g stroke="#00f0ff" stroke-width="0.8" opacity="0.5">
      <path d="M-10,-26 L0,-14 M-16,-2 L-6,8 M6,8 L-6,20 M-6,20 L2,36"/>
    </g>
  </g>

  <!-- метрика здоровья (зелёная) -->
  <g transform="translate(1080,200)">
    <circle cx="0" cy="0" r="26" fill="#06110b" stroke="#00e676" stroke-width="2.5" filter="url(#neon)"/>
    <path d="M-13,1 L-4,10 L14,-10" stroke="#00e676" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
