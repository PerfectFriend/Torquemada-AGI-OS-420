  <!-- заголовок -->
  <g transform="translate(52,54)">
    <text x="0" y="0" font-family="'Share Tech Mono','Courier New',monospace" font-size="15" letter-spacing="6" fill="#5ee7ff" opacity="0.9">OPEN-SOURCE CYBERSECURITY OS</text>
    <text x="0" y="62" font-family="'Share Tech Mono','Courier New',monospace" font-size="54" font-weight="700" letter-spacing="2" fill="url(#title)" filter="url(#neon)">TORQUEMADA 228 AGI</text>
    <text x="2" y="94" font-family="'Share Tech Mono','Courier New',monospace" font-size="16" fill="#9aa5b1">Madre Torquemada · default-deny firewall · RDP/VNC · RAT · AD · SIEM/EDR</text>
    <g transform="translate(0,118)">
      <rect x="0" y="0" width="196" height="32" rx="16" fill="#00f0ff" opacity="0.13" stroke="#00f0ff" stroke-width="1.4"/>
      <text x="16" y="21" font-family="'Share Tech Mono','Courier New',monospace" font-size="14" fill="#7ef2ff">bash SETUP.sh  →</text>
      <text x="212" y="21" font-family="'Share Tech Mono','Courier New',monospace" font-size="13" fill="#8b96a2">github.com/PerfectFriend/Torquemada-AGI-OS-420</text>
    </g>
  </g>
</svg>
