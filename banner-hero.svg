      <rect x="-26" y="26" width="15" height="4.5" rx="1.5" fill="#ffffff"/>
      <rect x="-26" y="30.5" width="15" height="4.5" fill="#2a4f9e"/>
      <rect x="-9" y="26" width="15" height="9" rx="1.5" fill="#ffffff" opacity="0.9"/>
      <rect x="-9" y="26" width="15" height="3" rx="1.5" fill="#c8102e"/>
      <rect x="-9" y="29" width="15" height="3" fill="#ffffff"/>
      <rect x="-9" y="32" width="15" height="3" fill="#ffc400"/>
      <rect x="8" y="26" width="15" height="9" rx="1.5" fill="#ffffff" opacity="0.9"/>
      <rect x="8" y="26" width="15" height="3" rx="1.5" fill="#aa151b"/>
      <rect x="8" y="29" width="15" height="3" fill="#f1bf00"/>
    </g>
