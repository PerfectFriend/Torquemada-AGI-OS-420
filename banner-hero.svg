    <circle cx="0" cy="0" r="24" fill="#06121a" stroke="#00f0ff" stroke-width="1.6"/>
    <ellipse cx="0" cy="0" rx="10" ry="24" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
    <path d="M-24,0 H24 M-20,-12 H20 M-20,12 H20" stroke="#00f0ff" stroke-width="1" opacity="0.55"/>
    <g>
