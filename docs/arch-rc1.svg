<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="monospace">
  <rect width="960" height="420" fill="#050a08"/>
  <text x="480" y="30" fill="#39ff6a" font-size="16" text-anchor="middle" font-weight="bold">Torquemada 228 AGI — архитектура RC1 (репозиторий = единый источник)</text>
  <!-- repo -->
  <rect x="40" y="70" width="200" height="90" rx="8" fill="#0a1f12" stroke="#39ff6a"/>
  <text x="140" y="100" fill="#39ff6a" font-size="13" text-anchor="middle" font-weight="bold">GitHub repo</text>
  <text x="140" y="120" fill="#9fe8b5" font-size="10" text-anchor="middle">PerfectFriend/Torquemada-AGI-OS-420</text>
  <text x="140" y="136" fill="#9fe8b5" font-size="10" text-anchor="middle">SETUP.sh · app/dist · src-tauri</text>
  <text x="140" y="150" fill="#9fe8b5" font-size="10" text-anchor="middle">i18n RU/EN/ES · CI workflow</text>
  <!-- installer -->
  <rect x="300" y="70" width="180" height="90" rx="8" fill="#0a1f12" stroke="#ffd166"/>
  <text x="390" y="100" fill="#ffd166" font-size="13" text-anchor="middle" font-weight="bold">SETUP.sh</text>
  <text x="390" y="118" fill="#9fe8b5" font-size="10" text-anchor="middle">проверка зависимостей</text>
  <text x="390" y="132" fill="#9fe8b5" font-size="10" text-anchor="middle">cargo build / релиз .deb</text>
  <text x="390" y="146" fill="#9fe8b5" font-size="10" text-anchor="middle">sidecars · автозагрузка</text>
  <!-- install paths -->
  <rect x="540" y="60" width="180" height="50" rx="8" fill="#0a1f12" stroke="#39ff6a"/>
  <text x="630" y="80" fill="#39ff6a" font-size="11" text-anchor="middle" font-weight="bold">~/.w420/opt/w420/w420</text>
  <text x="630" y="96" fill="#9fe8b5" font-size="10" text-anchor="middle">бинарник + dist/ фронтенд</text>
  <rect x="540" y="120" width="180" height="40" rx="8" fill="#0a1f12" stroke="#39ff6a"/>
  <text x="630" y="136" fill="#39ff6a" font-size="11" text-anchor="middle">~/.w420/binaries/</text>
  <text x="630" y="150" fill="#9fe8b5" font-size="10" text-anchor="middle">sing-box · trivy · gitleaks</text>
  <!-- services -->
  <rect x="780" y="60" width="150" height="50" rx="8" fill="#0a1f12" stroke="#ff6a6a"/>
  <text x="855" y="80" fill="#ff6a6a" font-size="11" text-anchor="middle" font-weight="bold">systemd --user</text>
  <text x="855" y="96" fill="#9fe8b5" font-size="10" text-anchor="middle">torquemada-228-agi.service</text>
  <rect x="780" y="120" width="150" height="40" rx="8" fill="#0a1f12" stroke="#ff6a6a"/>
  <text x="855" y="136" fill="#ff6a6a" font-size="11" text-anchor="middle">XDG autostart</text>
  <text x="855" y="150" fill="#9fe8b5" font-size="10" text-anchor="middle">.desktop entry</text>
  <!-- runtime -->
  <rect x="300" y="220" width="360" height="150" rx="8" fill="#0a1f12" stroke="#39ff6a"/>
  <text x="480" y="245" fill="#39ff6a" font-size="13" text-anchor="middle" font-weight="bold">W420 runtime (Tauri v2, пользователь, без root)</text>
  <text x="480" y="268" fill="#9fe8b5" font-size="10" text-anchor="middle">Десктоп-слой: окна, виртуальные столы, темы (8), i18n (3 языка)</text>
  <text x="480" y="286" fill="#9fe8b5" font-size="10" text-anchor="middle">Модули: Madre/firewall · SIEM/EDR · RDP/VNC · RAT · AD · Health · AI-чат · TTS/STT</text>
  <text x="480" y="304" fill="#9fe8b5" font-size="10" text-anchor="middle">API-ключи провайдеров — AES-256-GCM на диске, во фронтенд уходит только маска …abcd</text>
  <text x="480" y="322" fill="#9fe8b5" font-size="10" text-anchor="middle">sing-box — sidecar, управляется из Rust</text>
  <rect x="300" y="330" width="360" height="28" rx="6" fill="#1a0d0d" stroke="#ff6a6a"/>
  <text x="480" y="348" fill="#ff8a8a" font-size="10" text-anchor="middle">root_setup.sh (опционально, по согласию): nftables base + узкое NOPASSWD sudo</text>
  <!-- arrows -->
  <g stroke="#39ff6a" stroke-width="2" fill="none">
    <line x1="240" y1="115" x2="300" y2="115"/><polygon points="300,115 292,111 292,119" fill="#39ff6a"/>
    <line x1="480" y1="115" x2="540" y2="85"/><polygon points="540,85 531,86 535,93" fill="#39ff6a"/>
    <line x1="480" y1="115" x2="540" y2="140"/><polygon points="540,140 531,138 534,146" fill="#39ff6a"/>
    <line x1="720" y1="85" x2="780" y2="85"/><polygon points="780,85 772,81 772,89" fill="#39ff6a"/>
    <line x1="720" y1="140" x2="780" y2="140"/><polygon points="780,140 772,136 772,144" fill="#39ff6a"/>
    <line x1="855" y1="110" x2="855" y2="160" stroke="#ff6a6a"/>
    <line x1="780" y1="160" x2="660" y2="220" stroke="#ff6a6a"/><polygon points="660,220 668,215 664,210" fill="#ff6a6a"/>
    <line x1="390" y1="160" x2="390" y2="220"/><polygon points="390,220 386,212 394,212" fill="#39ff6a"/>
  </g>
