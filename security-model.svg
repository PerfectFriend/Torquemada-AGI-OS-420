<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2a2a"/>
      <stop offset="100%" stop-color="#2a1a1a"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3d2f"/>
      <stop offset="100%" stop-color="#1a2a21"/>
    </linearGradient>
    <linearGradient id="blu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3a52"/>
      <stop offset="100%" stop-color="#162a3c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00ff41"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff2244"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="24" y="34" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e0e6ed">Модель безопасности — zero-trust, default-deny</text>
  <text x="24" y="56" font-family="share-tech-mono,monospace" font-size="11" fill="#9aa5b1">«Доверяем только своим пакетам — чужие все дропаем» — Madre Torquemada</text>

  <!-- internet -->
  <rect x="30" y="90" width="180" height="80" rx="8" fill="url(#red)" stroke="#ff2244" stroke-width="1.5"/>
  <text x="120" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e0e6ed">ИНТЕРНЕТ / чужие</text>
  <text x="120" y="148" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">весь входящий = DROP</text>

  <line x1="210" y1="130" x2="290" y2="130" stroke="#ff2244" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="222" y="118" font-family="share-tech-mono,monospace" font-size="10" fill="#ff2244">nftables drop</text>

  <!-- firewall -->
  <rect x="295" y="90" width="220" height="80" rx="8" fill="url(#blu)" stroke="#00ff41" stroke-width="1.5" filter="url(#glow)"/>
  <text x="405" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e0e6ed">🛡 Madre — default-deny</text>
  <text x="405" y="138" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">allowlist только своих хостов</text>
  <text x="405" y="155" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">профили: office/guest/dmz/isolated/emergency</text>

  <line x1="515" y1="130" x2="595" y2="130" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="528" y="118" font-family="share-tech-mono,monospace" font-size="10" fill="#00ff41">свои пакеты</text>

  <!-- host -->
  <rect x="600" y="90" width="180" height="80" rx="8" fill="url(#grn)" stroke="#00ff41" stroke-width="1.5"/>
  <text x="690" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e0e6ed">Хост W420</text>
  <text x="690" y="138" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">Tauri v2 + Rust-ядро</text>
  <text x="690" y="155" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">порты: P2P 4001 · API 4010 · TTS 8420</text>

  <!-- honeypot -->
  <rect x="820" y="90" width="150" height="80" rx="8" fill="url(#red)" stroke="#ffb000" stroke-width="1.5"/>
  <text x="895" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#e0e6ed">🍯 Honeypot</text>
  <text x="895" y="138" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="9" fill="#9aa5b1">22/2222/3389/8080/8443/9200</text>
  <text x="895" y="155" text-anchor="middle" font-family="share-tech-mono,monospace" font-size="9" fill="#9aa5b1">логи → madre.db → SIEM</text>

  <!-- watchdog -->
  <rect x="30" y="230" width="300" height="90" rx="8" fill="#141c28" stroke="#00e5ff"/>
  <text x="180" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#e0e6ed">🐺 Watchdog</text>
  <text x="48" y="282" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">скан ss -tunap → C2-порты вне своих сетей</text>
  <text x="48" y="302" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">→ событие watchdog + алерт в трей</text>

  <line x1="330" y1="275" x2="390" y2="275" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- secrets -->
  <rect x="395" y="230" width="300" height="90" rx="8" fill="url(#grn)" stroke="#00ff41" stroke-width="1.5" filter="url(#glow)"/>
  <text x="545" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#e0e6ed">🔐 Секреты на диске</text>
  <text x="413" y="282" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">API-ключи провайдеров: AES-256-GCM</text>
  <text x="413" y="302" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">во фронтенд уходит только маска «…abcd»</text>

  <line x1="695" y1="275" x2="755" y2="275" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- sudo boundary -->
  <rect x="760" y="230" width="210" height="90" rx="8" fill="url(#blu)" stroke="#b26bff" stroke-width="1.5"/>
  <text x="865" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#e0e6ed">Граница sudo</text>
  <text x="778" y="282" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">root_setup.sh — только по явному</text>
  <text x="778" y="302" font-family="share-tech-mono,monospace" font-size="10" fill="#9aa5b1">согласию; NOPASSWD только на nft</text>

  <!-- bottom strip -->
  <rect x="30" y="360" width="940" height="70" rx="8" fill="#141c28" stroke="#2a3a4f"/>
  <text x="48" y="388" font-family="share-tech-mono,monospace" font-size="11" fill="#00ff41">Zero-trust: враг = любой пакет вне allowlist. Входящий drop по умолчанию, исходящий — только своим.</text>
  <text x="48" y="410" font-family="share-tech-mono,monospace" font-size="11" fill="#9aa5b1">Шифрование ключей: w420_ai::encryption (AES-256-GCM) · TTS-токен X-W420-Token никогда не форвардится во фронтенд · секреты вне git (.gitignore)</text>
</svg>
